<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380">
  <rect width="720" height="380" fill="#fafafa" rx="8"/>
  <text x="360" y="26" text-anchor="middle" font-size="14" font-weight="600" fill="#444">单帧耗时对比（ms）</text>
  <text x="360" y="46" text-anchor="middle" font-size="11" fill="#888">RTX 4060 Laptop，360 张逐张计时，越低越好</text>

  <!-- 网格与刻度 -->
  <line x1="100" y1="70" x2="690" y2="70" stroke="#eee" stroke-width="1"/>
  <line x1="100" y1="130" x2="690" y2="130" stroke="#eee" stroke-width="1"/>
  <line x1="100" y1="190" x2="690" y2="190" stroke="#eee" stroke-width="1"/>
  <line x1="100" y1="250" x2="690" y2="250" stroke="#eee" stroke-width="1"/>
  <line x1="100" y1="310" x2="690" y2="310" stroke="#ddd" stroke-width="1"/>
  <text x="92" y="314" text-anchor="end" font-size="10" fill="#999">0</text>
  <text x="92" y="254" text-anchor="end" font-size="10" fill="#999">5</text>
  <text x="92" y="194" text-anchor="end" font-size="10" fill="#999">10</text>
  <text x="92" y="134" text-anchor="end" font-size="10" fill="#999">15</text>
  <text x="92" y="74" text-anchor="end" font-size="10" fill="#999">20</text>

  <!-- 均值 -->
  <rect x="135" y="259" width="44" height="51" fill="#7f8c8d" rx="3"/>
  <text x="157" y="251" text-anchor="middle" font-size="10" fill="#555">4.29</text>
  <rect x="191" y="143" width="44" height="167" fill="#3498db" rx="3"/>
  <text x="213" y="135" text-anchor="middle" font-size="10" fill="#555">13.92</text>
  <text x="185" y="330" text-anchor="middle" font-size="13" font-weight="600" fill="#333">均值</text>

  <!-- 中位 -->
  <rect x="330" y="258" width="44" height="52" fill="#7f8c8d" rx="3"/>
  <text x="352" y="250" text-anchor="middle" font-size="10" fill="#555">4.33</text>
  <rect x="386" y="145" width="44" height="165" fill="#3498db" rx="3"/>
  <text x="408" y="137" text-anchor="middle" font-size="10" fill="#555">13.79</text>
  <text x="380" y="330" text-anchor="middle" font-size="13" font-weight="600" fill="#333">中位</text>

  <!-- 最慢 -->
  <rect x="525" y="218" width="44" height="92" fill="#7f8c8d" rx="3"/>
  <text x="547" y="210" text-anchor="middle" font-size="10" fill="#555">7.67</text>
  <rect x="581" y="98" width="44" height="212" fill="#3498db" rx="3"/>
  <text x="603" y="90" text-anchor="middle" font-size="10" fill="#555">17.63</text>
  <text x="575" y="330" text-anchor="middle" font-size="13" font-weight="600" fill="#333">最慢</text>

  <!-- 图例 -->
  <rect x="40" y="358" width="12" height="12" fill="#7f8c8d"/>
  <text x="56" y="368" font-size="10" fill="#666">OpenCV 规则链</text>
  <rect x="170" y="358" width="12" height="12" fill="#3498db"/>
  <text x="186" y="368" font-size="10" fill="#666">YOLOv8m</text>
  <text x="690" y="368" text-anchor="end" font-size="10" fill="#2c7fb8">均值慢 3.24 倍</text>
</svg>
