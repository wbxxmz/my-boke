<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360">
  <rect width="720" height="360" fill="#fafafa" rx="8"/>
  <text x="360.0" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#444">三档的配置和耗时</text>
  <!-- 左面板 -->
  <text x="190.0" y="50" text-anchor="middle" font-size="11" fill="#888" font-weight="600">参数量 &amp; 权重体积</text>
  <!-- 左面板网格 -->
  <line x1="40" y1="300" x2="340" y2="300" stroke="#eee" stroke-width="1"/>
  <line x1="40" y1="255" x2="340" y2="255" stroke="#eee" stroke-width="1"/>
  <line x1="40" y1="210" x2="340" y2="210" stroke="#eee" stroke-width="1"/>
  <line x1="40" y1="165" x2="340" y2="165" stroke="#eee" stroke-width="1"/>
  <line x1="40" y1="120" x2="340" y2="120" stroke="#eee" stroke-width="1"/>
  <rect x="40.0" y="278" width="28" height="22" fill="#7f8c8d" rx="2"/>
  <text x="54.0" y="274" text-anchor="middle" font-size="9" fill="#555">3.2M</text>
  <rect x="78.0" y="278" width="28" height="22" fill="#3498db" rx="2"/>
  <text x="92.0" y="274" text-anchor="middle" font-size="9" fill="#555">6.5MB</text>
  <text x="73.0" y="320" text-anchor="middle" font-size="13" font-weight="600" fill="#333">n</text>
  <text x="73.0" y="334" text-anchor="middle" font-size="10" fill="#999">20轮 · 416</text>
  <rect x="157.0" y="222" width="28" height="78" fill="#7f8c8d" rx="2"/>
  <text x="171.0" y="218" text-anchor="middle" font-size="9" fill="#555">11.2M</text>
  <rect x="195.0" y="222" width="28" height="78" fill="#3498db" rx="2"/>
  <text x="209.0" y="218" text-anchor="middle" font-size="9" fill="#555">22.5MB</text>
  <text x="190.0" y="320" text-anchor="middle" font-size="13" font-weight="600" fill="#333">s</text>
  <text x="190.0" y="334" text-anchor="middle" font-size="10" fill="#999">50轮 · 416</text>
  <rect x="274.0" y="120" width="28" height="180" fill="#7f8c8d" rx="2"/>
  <text x="288.0" y="116" text-anchor="middle" font-size="9" fill="#555">25.9M</text>
  <rect x="312.0" y="120" width="28" height="180" fill="#3498db" rx="2"/>
  <text x="326.0" y="116" text-anchor="middle" font-size="9" fill="#555">52.1MB</text>
  <text x="307.0" y="320" text-anchor="middle" font-size="13" font-weight="600" fill="#333">m</text>
  <text x="307.0" y="334" text-anchor="middle" font-size="10" fill="#999">100轮 · 640</text>
  <!-- 左图例 -->
  <rect x="40" y="355" width="12" height="12" fill="#7f8c8d"/>
  <text x="56" y="365" font-size="10" fill="#666">参数量（M）</text>
  <rect x="150" y="355" width="12" height="12" fill="#3498db"/>
  <text x="166" y="365" font-size="10" fill="#666">权重（MB）</text>
  <!-- 右面板 -->
  <text x="530.0" y="50" text-anchor="middle" font-size="11" fill="#888" font-weight="600">训练耗时（h）</text>
  <!-- 右面板网格 -->
  <line x1="380" y1="300" x2="680" y2="300" stroke="#eee" stroke-width="1"/>
  <line x1="380" y1="255" x2="680" y2="255" stroke="#eee" stroke-width="1"/>
  <line x1="380" y1="210" x2="680" y2="210" stroke="#eee" stroke-width="1"/>
  <line x1="380" y1="165" x2="680" y2="165" stroke="#eee" stroke-width="1"/>
  <line x1="380" y1="120" x2="680" y2="120" stroke="#eee" stroke-width="1"/>
  <rect x="380.0" y="238" width="66" height="62" fill="#e67e22" rx="2"/>
  <text x="413.0" y="234" text-anchor="middle" font-size="9" fill="#555">0.34h</text>
  <text x="413.0" y="320" text-anchor="middle" font-size="13" font-weight="600" fill="#333">n</text>
  <text x="413.0" y="334" text-anchor="middle" font-size="10" fill="#999">CPU 0.34h</text>
  <rect x="497.0" y="282" width="66" height="18" fill="#27ae60" rx="2"/>
  <text x="530.0" y="278" text-anchor="middle" font-size="9" fill="#555">0.10h</text>
  <text x="530.0" y="320" text-anchor="middle" font-size="13" font-weight="600" fill="#333">s</text>
  <text x="530.0" y="334" text-anchor="middle" font-size="10" fill="#999">GPU 0.10h</text>
  <rect x="614.0" y="120" width="66" height="180" fill="#c0392b" rx="2"/>
  <text x="647.0" y="116" text-anchor="middle" font-size="9" fill="#555">0.99h</text>
  <text x="647.0" y="320" text-anchor="middle" font-size="13" font-weight="600" fill="#333">m</text>
  <text x="647.0" y="334" text-anchor="middle" font-size="10" fill="#999">GPU 0.99h</text>
  <!-- 右面板注释 -->
  <text x="530.0" y="355" text-anchor="middle" font-size="10" fill="#999">* n 跑在 CPU，和 s/m 不可直接比</text>
</svg>