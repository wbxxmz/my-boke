<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="520" height="320">
  <!-- 背景 -->
  <rect width="520" height="320" fill="#fafafa" rx="8"/>

  <text x="260" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#444">三档的配置和耗时</text>

  <!-- 参数量柱（左面板） -->
  <g transform="translate(40,50)">
    <text x="80" y="0" text-anchor="middle" font-size="11" fill="#888" font-weight="600">参数量 &amp; 权重体积</text>

    <!-- 背景网格线 -->
    <g stroke="#eee" stroke-width="1">
      <line x1="0" y1="180" x2="200" y2="180"/>
      <line x1="0" y1="135" x2="200" y2="135"/>
      <line x1="0" y1="90"  x2="200" y2="90"/>
      <line x1="0" y1="45"  x2="200" y2="45"/>
      <line x1="0" y1="0"   x2="200" y2="0"/>
    </g>

    <!-- n: 3.2M params, 6.5MB 权重 -->
    <g transform="translate(25,0)">
      <!-- 参数量 3.2M 按比例: max 25.9M -> 3.2/25.9*180 = 22 -->
      <rect x="0" y="158" width="40" height="22" fill="#95a5a6" rx="2"/>
      <!-- 权重 6.5MB: max 52.1MB -> 6.5/52.1*180 = 22.5 -->
      <rect x="50" y="158" width="40" height="22" fill="#3498db" rx="2"/>
      <text x="20" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#333">n</text>
      <text x="20" y="215" text-anchor="middle" font-size="10" fill="#888">20轮</text>
    </g>

    <!-- s: 11.2M params, 22.5MB 权重 -->
    <g transform="translate(110,0)">
      <rect x="0" y="102" width="40" height="78" fill="#95a5a6" rx="2"/>
      <rect x="50" y="102" width="40" height="78" fill="#3498db" rx="2"/>
      <text x="20" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#333">s</text>
      <text x="20" y="215" text-anchor="middle" font-size="10" fill="#888">50轮</text>
    </g>

    <!-- m: 25.9M params, 52.1MB 权重 -->
    <g transform="translate(195,0)">
      <rect x="0" y="0" width="40" height="180" fill="#2c3e50" rx="2"/>
      <rect x="50" y="0" width="40" height="180" fill="#2980b9" rx="2"/>
      <text x="20" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#333">m</text>
      <text x="20" y="215" text-anchor="middle" font-size="10" fill="#888">100轮 640</text>
    </g>

    <!-- 图例 -->
    <rect x="0" y="235" width="12" height="12" fill="#95a5a6"/>
    <text x="18" y="245" font-size="10" fill="#666">参数量（M）</text>
    <rect x="90" y="235" width="12" height="12" fill="#3498db"/>
    <text x="108" y="245" font-size="10" fill="#666">权重（MB）</text>
  </g>

  <!-- 训练耗时柱（右面板） -->
  <g transform="translate(290,50)">
    <text x="80" y="0" text-anchor="middle" font-size="11" fill="#888" font-weight="600">训练耗时（GPU 除 n）</text>

    <!-- 背景网格 -->
    <g stroke="#eee" stroke-width="1">
      <line x1="0" y1="180" x2="160" y2="180"/>
      <line x1="0" y1="135" x2="160" y2="135"/>
      <line x1="0" y1="90"  x2="160" y2="90"/>
      <line x1="0" y1="45"  x2="160" y2="45"/>
      <line x1="0" y1="0"   x2="160" y2="0"/>
    </g>

    <!-- 反向：n=0.342h, s=0.100h, m=0.989h, max=1, 所以 m 最高 -->
    <!-- n: 0.342/0.989*180=62, s: 0.100/0.989*180=18, m:180 -->
    <g transform="translate(10,0)">
      <rect x="0" y="118" width="40" height="62" fill="#e67e22" rx="2"/>
      <text x="20" y="190" text-anchor="middle" font-size="13" font-weight="600" fill="#333">n</text>
      <text x="20" y="203" text-anchor="middle" font-size="10" fill="#888">CPU 0.34h</text>
    </g>
    <g transform="translate(60,0)">
      <rect x="0" y="162" width="40" height="18" fill="#27ae60" rx="2"/>
      <text x="20" y="190" text-anchor="middle" font-size="13" font-weight="600" fill="#333">s</text>
      <text x="20" y="203" text-anchor="middle" font-size="10" fill="#888">GPU 0.10h</text>
    </g>
    <g transform="translate(110,0)">
      <rect x="0" y="0" width="40" height="180" fill="#c0392b" rx="2"/>
      <text x="20" y="190" text-anchor="middle" font-size="13" font-weight="600" fill="#333">m</text>
      <text x="20" y="203" text-anchor="middle" font-size="10" fill="#888">GPU 0.99h</text>
    </g>

    <text x="80" y="235" text-anchor="middle" font-size="10" fill="#999">n 跑在 CPU，和 s/m 不可直接比</text>
  </g>
</svg>
