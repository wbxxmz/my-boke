<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" width="560" height="280">
  <!-- 背景 -->
  <rect width="560" height="280" fill="#fafafa" rx="8"/>

  <!-- 左面板：图像级 -->
  <g>
    <text x="40" y="28" font-size="15" font-weight="600" fill="#333">图像级：一张图里有一个缺陷被检出就算 FAIL</text>
    <rect x="30" y="40" width="220" height="170" fill="#fff" stroke="#ddd" rx="6"/>
    <!-- 三个真实缺陷（红虚线） -->
    <rect x="50" y="60" width="40" height="40" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="4,3"/>
    <rect x="105" y="110" width="35" height="35" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="4,3"/>
    <rect x="160" y="70" width="42" height="38" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="4,3"/>
    <!-- 模型只检出一个（绿实线） -->
    <rect x="52" y="62" width="36" height="36" fill="none" stroke="#27ae60" stroke-width="2.5"/>
    <!-- 图例 -->
    <rect x="38" y="222" width="14" height="14" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="3,2"/>
    <text x="58" y="234" font-size="12" fill="#555">真实缺陷</text>
    <rect x="120" y="222" width="14" height="14" fill="none" stroke="#27ae60" stroke-width="2.5"/>
    <text x="140" y="234" font-size="12" fill="#555">模型检出</text>
    <!-- 结论 -->
    <text x="40" y="258" font-size="13" font-weight="600" fill="#27ae60">✅ FAIL（检出 ≥ 1）</text>
  </g>

  <!-- 右面板：逐框 Recall -->
  <g>
    <text x="320" y="28" font-size="15" font-weight="600" fill="#333">逐框 Recall：真实有几个，检出了几个</text>
    <rect x="310" y="40" width="220" height="170" fill="#fff" stroke="#ddd" rx="6"/>
    <!-- 三个真实缺陷（红虚线） -->
    <rect x="330" y="60" width="40" height="40" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="4,3"/>
    <rect x="385" y="110" width="35" height="35" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="4,3"/>
    <rect x="440" y="70" width="42" height="38" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="4,3"/>
    <!-- 模型只检出一个（绿实线） -->
    <rect x="332" y="62" width="36" height="36" fill="none" stroke="#27ae60" stroke-width="2.5"/>
    <!-- 两个漏检打叉 -->
    <g stroke="#e74c3c" stroke-width="2.5" fill="none">
      <line x1="388" y1="113" x2="416" y2="139"/>
      <line x1="416" y1="113" x2="388" y2="139"/>
      <line x1="443" y1="73" x2="479" y2="105"/>
      <line x1="479" y1="73" x2="443" y2="105"/>
    </g>
    <!-- 结论 -->
    <text x="320" y="258" font-size="13" font-weight="600" fill="#e67e22">Recall = 1/3 = 33%</text>
    <text x="320" y="273" font-size="11" fill="#888">（2 个漏检被打叉）</text>
  </g>

  <!-- 中间箭头 -->
  <g fill="none" stroke="#bbb" stroke-width="1.5" stroke-dasharray="3,3">
    <line x1="260" y1="125" x2="300" y2="125"/>
  </g>
</svg>
